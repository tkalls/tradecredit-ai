[project]
name = "notes-api"
version = "0.1.0"
description = "Basics exercises 5, 7 and 8: FastAPI CRUD for notes on Postgres, with tests."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg[binary]",
]

[dependency-groups]
dev = [
    "httpx2",  # FastAPI's TestClient needs it
    # FastAPI's TestClient needs it
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["notes_api"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=notes_api --cov-report=term-missing"

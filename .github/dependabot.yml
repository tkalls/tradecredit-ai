# Weekly PRs to bump pinned GitHub Actions and Python dependencies. Each one goes through CI like any other PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-dev-tools:
        dependency-type: development

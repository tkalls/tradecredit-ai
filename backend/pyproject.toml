[project]
name = "tradecredit-ai"
version = "0.0.1"
description = "Import-finance credit decisions: the LLM extracts, a deterministic scorecard decides, a human can override."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff==0.17.4",  # keep in step with .pre-commit-config.yaml
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused imports, undefined names
    "I",       # isort: import order
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern syntax
    "SIM",     # simplify
    "S",       # bandit: security smells
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]  # tests are type-checked too

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"

# Layering from AGENTS.md: api -> services -> domain, never the other way.
# `lint-imports` runs in CI. Layers that don't exist yet are skipped until they do.
[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "api -> services -> domain"
type = "layers"
layers = ["(app.api)", "(app.services)", "app.domain"]

[[tool.importlinter.contracts]]
name = "domain is plain Python: no other layer, no framework, no SDK"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.api", "app.services", "app.adapters", "app.workers", "fastapi", "sqlalchemy", "anthropic", "celery", "redis"]

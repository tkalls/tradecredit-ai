[project]
name = "tradecredit-ai"
version = "0.0.1"
description = "Import-finance credit decisions: the LLM extracts, a deterministic scorecard decides, a human can override."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused imports, undefined names
    "I",       # isort: import order
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern syntax
    "SIM",     # simplify
    "S",       # bandit: security smells
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
